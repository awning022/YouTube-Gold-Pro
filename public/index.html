<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Gold Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <style>
      :root {
        --bg-1: #050b14;
        --bg-2: #0b1220;
        --bg-3: #121a2a;
        --panel: rgba(18, 22, 30, 0.9);
        --panel-strong: rgba(12, 17, 25, 0.96);
        --border: rgba(168, 85, 247, 0.26);
        --soft-border: rgba(148, 163, 184, 0.12);
        --primary: #a855f7;
        --primary-2: #8b5cf6;
        --primary-3: #c084fc;
        --danger: #ef4444;
        --danger-2: #dc2626;
        --success: #22c55e;
        --warning: #f59e0b;
        --text: #edf2ff;
        --muted: #a9b9d3;
        --terminal: #baf7d0;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, rgba(168, 85, 247, 0.18), transparent 28%),
                    linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 45%, var(--bg-3) 100%);
        color: var(--text);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        padding: 20px;
      }

      .shell {
        max-width: 1200px;
        margin: 0 auto;
      }

      .header {
        text-align: center;
        border: 1px solid var(--border);
        border-radius: 22px;
        background: rgba(12, 18, 29, 0.8);
        padding: 28px 20px;
        box-shadow: 0 18px 40px rgba(2, 6, 23, 0.35), inset 0 1px 0 rgba(255,255,255,0.05);
        margin-bottom: 24px;
      }

      .header h1 {
        margin: 0 0 8px;
        font-weight: 800;
        font-size: clamp(2.1rem, 4vw, 3rem);
        background: linear-gradient(90deg, #f5d0fe, #c084fc, #8b5cf6);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .header p {
        margin: 0;
        color: var(--muted);
        font-size: 1.08rem;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
        margin-bottom: 24px;
      }

      .card {
        background: linear-gradient(180deg, rgba(20,25,35,0.9), rgba(14,18,24,0.85));
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 20px;
        box-shadow: 0 18px 40px rgba(2, 6, 23, 0.35), inset 0 1px 0 rgba(255,255,255,0.04);
      }

      .metric-label {
        color: var(--muted);
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        font-weight: 800;
      }

      .metric-value {
        font-size: clamp(1.8rem, 3vw, 2.3rem);
        font-weight: 800;
        margin-top: 12px;
        letter-spacing: -0.04em;
      }

      .panel {
        padding: 20px;
      }

      .nav-tabs {
        border-bottom: 1px solid var(--border);
        margin-bottom: 20px;
        gap: 12px;
      }

      .nav-item { margin-bottom: -1px; }

      .nav-link {
        color: var(--muted);
        background: transparent;
        border: none;
        border-bottom: 3px solid transparent;
        border-radius: 12px 12px 0 0;
        padding: 12px 18px;
        font-weight: 700;
      }

      .nav-link.active {
        color: #f5ebff;
        background: rgba(168, 85, 247, 0.08);
        border-bottom-color: var(--primary);
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 18px;
        margin-bottom: 18px;
      }

      label {
        display: block;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.76rem;
        font-weight: 800;
        margin-bottom: 8px;
      }

      input, select, button {
        width: 100%;
        border-radius: 12px;
        border: 1px solid rgba(168, 85, 247, 0.22);
        background: rgba(12, 16, 22, 0.8);
        color: var(--text);
        padding: 12px 14px;
      }

      input::placeholder { color: #8193af; }
      input:focus, select:focus {
        outline: none;
        box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.17);
        border-color: rgba(168, 85, 247, 0.8);
      }

      .button-row {
        display: flex;
        gap: 12px;
        margin: 18px 0 20px;
      }

      .btn {
        border: none;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 800;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-2px);
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        color: white;
        box-shadow: 0 12px 24px rgba(139, 92, 246, 0.32);
      }

      .btn-danger {
        background: linear-gradient(135deg, var(--danger), var(--danger-2));
        color: white;
        box-shadow: 0 12px 24px rgba(220, 38, 38, 0.3);
      }

      .btn-success {
        background: linear-gradient(135deg, #34d399, #16a34a);
        color: white;
        box-shadow: 0 12px 24px rgba(16, 185, 129, 0.28);
      }

      .status-box {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        background: rgba(5, 11, 20, 0.7);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 18px 20px;
      }

      .status-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--warning);
        display: inline-block;
        box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.45);
      }

      .dot.running {
        background: var(--success);
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.5);
      }

      .dot.error {
        background: var(--danger);
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5);
      }

      .status-meta {
        font-size: 0.72rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-weight: 800;
      }

      .status-message {
        font-weight: 700;
        color: var(--text);
      }

      .pill {
        border-radius: 999px;
        padding: 7px 12px;
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: rgba(148, 163, 184, 0.12);
        color: var(--text);
        border: 1px solid rgba(148, 163, 184, 0.2);
      }

      .pill.running {
        background: rgba(34, 197, 94, 0.12);
        color: #bbf7d0;
        border-color: rgba(34, 197, 94, 0.4);
      }

      .pill.error {
        background: rgba(239, 68, 68, 0.12);
        color: #fecaca;
        border-color: rgba(239, 68, 68, 0.4);
      }

      .small-muted {
        display: block;
        margin-top: 12px;
        color: var(--muted);
      }

      .terminal {
        margin-top: 20px;
        min-height: 220px;
        border-radius: 12px;
        border: 1px solid rgba(34, 197, 94, 0.26);
        background: rgba(2, 7, 12, 0.95);
        color: var(--terminal);
        padding: 16px;
        font-family: 'Consolas', 'Courier New', monospace;
        line-height: 1.7;
      }

      .terminal div {
        margin-bottom: 4px;
      }

      @media (max-width: 768px) {
        body { padding: 16px; }
        .button-row { flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="header">
        <h1><i class="fas fa-video"></i> YouTube Gold Pro</h1>
        <p>Painel Premium de Automação e Coleta de Leads</p>
      </header>

      <section class="metrics">
        <div class="card">
          <div class="metric-label">Total de Views</div>
          <div class="metric-value" id="totalViews">0</div>
        </div>
        <div class="card">
          <div class="metric-label">Minutos Assistidos</div>
          <div class="metric-value" id="minutesWatched">0</div>
        </div>
        <div class="card">
          <div class="metric-label">Proxies Ativos</div>
          <div class="metric-value" id="activeProxies">0</div>
        </div>
      </section>

      <div class="card panel">
        <ul class="nav nav-tabs" id="mainTabs">
          <li class="nav-item">
            <button class="nav-link active" type="button" data-tab="automation">Automação de Vídeo</button>
          </li>
          <li class="nav-item">
            <button class="nav-link" type="button" data-tab="leads">Coletor de Leads</button>
          </li>
        </ul>

        <div id="automation-panel">
          <div class="form-grid">
            <div>
              <label for="searchQuery">Termo de Busca</label>
              <input id="searchQuery" type="text" value="lofi hip hop radio" />
            </div>
            <div>
              <label for="channelName">Nome do Canal</label>
              <input id="channelName" type="text" value="YouTube Gold Pro" />
            </div>
            <div>
              <label for="sessionCount">Sessões</label>
              <input id="sessionCount" type="number" min="1" max="50" value="1" />
            </div>
          </div>

          <div class="form-grid">
            <div>
              <label for="operationMode">Modo de Operação</label>
              <select id="operationMode">
                <option value="view">Apenas Visualização</option>
                <option value="subscribe">Inscrição + Like</option>
              </select>
            </div>
            <div>
              <label for="invisibleMode">Modo Invisível</label>
              <select id="invisibleMode">
                <option value="no">Não</option>
                <option value="yes">Sim</option>
              </select>
            </div>
          </div>

          <div class="button-row">
            <button id="startBtn" class="btn btn-primary">Iniciar Automação</button>
            <button id="stopBtn" class="btn btn-danger">Parar Tudo</button>
            <button id="downloadBtn" class="btn btn-success">Baixar Relatório</button>
          </div>

          <div class="status-box">
            <div class="status-left">
              <span id="statusDot" class="dot"></span>
              <div>
                <div class="status-meta">Status</div>
                <div id="statusText" class="status-message">Aguardando início...</div>
              </div>
            </div>
            <span id="statusPill" class="pill">Idle</span>
          </div>
          <small id="statusDetails" class="small-muted">Sistema pronto</small>

          <div id="terminal" class="terminal">
            <div>[INFO] Sistema pronto</div>
            <div>[INFO] Dashboard operacional</div>
          </div>
        </div>

        <div id="leads-panel" style="display:none;">
          <div class="form-grid">
            <div>
              <label for="leadSource">Fonte</label>
              <input id="leadSource" type="text" value="youtube" />
            </div>
            <div>
              <label for="leadLimit">Limite</label>
              <input id="leadLimit" type="number" value="250" />
            </div>
          </div>
          <div class="button-row">
            <button id="collectLeadsBtn" class="btn btn-success">Coletar Leads</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      const statusPill = document.getElementById('statusPill');
      const statusDetails = document.getElementById('statusDetails');
      const terminal = document.getElementById('terminal');

      function setStatus(state, message, details) {
        statusText.textContent = message || 'Aguardando início...';
        statusDetails.textContent = details || 'Sistema pronto';
        statusDot.className = 'dot';
        statusPill.className = 'pill';

        if (state === 'running') {
          statusDot.classList.add('running');
          statusPill.classList.add('running');
          statusPill.textContent = 'Running';
        } else if (state === 'error') {
          statusDot.classList.add('error');
          statusPill.classList.add('error');
          statusPill.textContent = 'Error';
        } else if (state === 'completed') {
          statusPill.textContent = 'Complete';
        } else if (state === 'stopped') {
          statusPill.textContent = 'Stopped';
        } else {
          statusPill.textContent = 'Idle';
        }
      }

      function setTerminal(lines) {
        terminal.innerHTML = lines.map((line) => `<div>${line}</div>`).join('');
      }

      async function fetchStatus() {
        try {
          const res = await fetch('/api/status');
          const data = await res.json();

          if (Array.isArray(data.logs) && data.logs.length) {
            setTerminal(data.logs.slice(-8));
          }

          if (data.running) {
            setStatus('running', data.output || 'Executando...', 'Iniciando processos...');
            return;
          }

          if (data.status === 'error') {
            setStatus('error', data.output || 'Erro detectado', 'Valide os logs de execução');
          } else if (data.status === 'completed') {
            setStatus('completed', data.output || 'Execução finalizada', 'Processo concluído com sucesso');
          } else if (data.status === 'stopped') {
            setStatus('stopped', data.output || 'Automação interrompida', 'Operação parada pelo usuário');
          } else {
            setStatus('idle', 'Aguardando início...', 'Sistema pronto');
          }
        } catch (error) {
          console.error(error);
        }
      }

      document.querySelectorAll('[data-tab]').forEach((button) => {
        button.addEventListener('click', () => {
          document.querySelectorAll('[data-tab]').forEach((btn) => btn.classList.remove('active'));
          button.classList.add('active');

          const isAutomation = button.dataset.tab === 'automation';
          document.getElementById('automation-panel').style.display = isAutomation ? 'block' : 'none';
          document.getElementById('leads-panel').style.display = isAutomation ? 'none' : 'block';
        });
      });

      document.getElementById('startBtn').addEventListener('click', async () => {
        const payload = {
          searchQuery: document.getElementById('searchQuery').value,
          sessionCount: Number(document.getElementById('sessionCount').value || 1),
          headless: true,
          stealth: true,
          randomize: true,
        };

        setStatus('running', 'Iniciando automação...', 'Preparando execução');

        const res = await fetch('/api/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        const result = await res.json();
        if (!res.ok) {
          setStatus('error', result.message || 'Erro ao iniciar', 'Falha na execução');
          return;
        }

        setStatus('running', 'Automação iniciada', 'Executando sessões');
      });

      document.getElementById('stopBtn').addEventListener('click', async () => {
        await fetch('/api/stop', { method: 'POST' });
        setStatus('stopped', 'Parando automação...', 'Solicitação enviada');
      });

      document.getElementById('downloadBtn').addEventListener('click', () => {
        window.open('/api/report/download?type=json', '_blank');
      });

      document.getElementById('collectLeadsBtn').addEventListener('click', () => {
        setStatus('completed', 'Coleta iniciada', 'Processo de leads em execução');
      });

      fetchStatus();
      setInterval(fetchStatus, 2500);
    </script>
  </body>
</html>
